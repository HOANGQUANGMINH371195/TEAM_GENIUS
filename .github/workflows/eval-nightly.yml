name: Release Evaluation

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      run_ragas:
        description: "Run costlier full RAGAS evaluation"
        required: false
        default: false
        type: boolean
      run_promptfoo:
        description: "Run offline Promptfoo regression/red-team suite"
        required: false
        default: false
        type: boolean

jobs:
  deterministic-release-gates:
    runs-on: self-hosted
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: medical_legal_active

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements/dev.lock
      - name: Check external release artifacts
        id: release-artifacts
        run: |
          if [ -f data/clean/medical_active_v31_fully_reviewed/release_benchmark.jsonl ] && \
             [ -f data/clean/medical_active_v31_fully_reviewed/semantic_question_benchmark.jsonl ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            PYTHONPATH=. python scripts/verify_release_artifacts.py --root . --require \
              --output eval/results/release-artifacts.json
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::External release artifacts are not mounted; source-only checks remain, semantic retrieval evaluation is not run."
          fi
      - name: Validate release-locked suite
        run: PYTHONPATH=database/pipeline:. pytest -q eval/test_release_locked_suite.py
      - name: Evaluate Qdrant thematic retrieval
        if: steps.release-artifacts.outputs.available == 'true'
        run: >-
          PYTHONPATH=database/pipeline:. python database/corpus/evaluate_qdrant_semantic.py
          --benchmark data/clean/medical_active_v31_fully_reviewed/semantic_question_benchmark.jsonl
          --dataset-id snapshot-c439751724ab7f10
          --output eval/results/nightly-qdrant-semantic.json
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-qdrant-semantic
          path: eval/results/nightly-qdrant-semantic.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact-contract
          path: eval/results/release-artifacts.json
          if-no-files-found: ignore

  full-ragas:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ragas
    needs: deterministic-release-gates
    runs-on: self-hosted
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: medical_legal_active
      MODEL_NAME: ${{ secrets.MODEL_NAME || 'gpt-5.6-luna' }}
      EVAL_MODEL_NAME: ${{ secrets.EVAL_MODEL_NAME || 'gpt-4o-mini' }}
      PROMPT_REGISTRY_NAME: medipay-system
      PROMPT_REGISTRY_LABEL: production
      EVAL_AGENT_MODE: read_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements/dev.lock
      - name: Create isolated RAGAS runtime
        run: python -m venv .eval-ragas-venv && .eval-ragas-venv/bin/pip install "ragas==0.3.9" "langchain-openai<1"
      - name: Run full read-only RAGAS evaluation
        run: >-
          python eval/golden_eval.py live --source-dir data/raw --out eval/results/nightly-ragas
          --count 30 --ragas-python .eval-ragas-venv/bin/python
          --evaluator-model "${EVAL_MODEL_NAME:-gpt-4o-mini}"
          --embedding-model text-embedding-3-small --concurrency 3 --threshold 0.60
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-ragas
          path: eval/results/nightly-ragas

  promptfoo-redteam:
    if: github.event_name == 'workflow_dispatch' && inputs.run_promptfoo
    runs-on: self-hosted
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Promptfoo regression and red-team checks
        run: npx --yes promptfoo@latest eval -c eval/promptfoo.yaml --no-cache
