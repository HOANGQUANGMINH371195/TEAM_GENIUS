name: Release Evaluation

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      run_ragas:
        description: "Run costlier full RAGAS evaluation"
        required: false
        default: false
        type: boolean

jobs:
  deterministic-release-gates:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: medical_legal_active

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements/dev.lock
      - name: Validate release-locked suite
        run: PYTHONPATH=database/pipeline:. pytest -q eval/test_release_locked_suite.py
      - name: Evaluate Qdrant thematic retrieval
        run: >-
          PYTHONPATH=database/pipeline:. python database/corpus/evaluate_qdrant_semantic.py
          --benchmark data/clean/medical_active_v31_fully_reviewed/semantic_question_benchmark.jsonl
          --dataset-id snapshot-c439751724ab7f10
          --output eval/results/nightly-qdrant-semantic.json
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-qdrant-semantic
          path: eval/results/nightly-qdrant-semantic.json

  full-ragas:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ragas
    needs: deterministic-release-gates
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: medical_legal_active
      MODEL_NAME: gpt-4.1-mini
      EVAL_AGENT_MODE: read_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements/dev.lock
      - name: Create isolated RAGAS runtime
        run: python -m venv .eval-ragas-venv && .eval-ragas-venv/bin/pip install "ragas==0.3.9" "langchain-openai<1"
      - name: Run full read-only RAGAS evaluation
        run: >-
          python eval/golden_eval.py live --source-dir data/raw --out eval/results/nightly-ragas
          --count 30 --ragas-python .eval-ragas-venv/bin/python --evaluator-model gpt-4o-mini
          --embedding-model text-embedding-3-small --concurrency 3 --threshold 0.60
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-ragas
          path: eval/results/nightly-ragas
