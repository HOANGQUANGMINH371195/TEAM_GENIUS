[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medipay-corpus-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Compatibility boundary for deterministic MediPay corpus contracts"

[tool.setuptools.packages.find]
where = ["src"]
