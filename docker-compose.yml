name: medipay

x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,noexec,nosuid
  security_opt:
    - no-new-privileges:true
  healthcheck:
    # python:3.11-slim installs the interpreter under /usr/local/bin.
    test: ["CMD", "/usr/local/bin/python3.11", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT','8000') + '/health', timeout=5)"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s
  networks:
    - edge
    - app
    - data

services:
  api-managed:
    <<: *api-common
    profiles: [managed-production]
    environment:
      # The managed-production profile must never inherit a developer .env
      # value such as APP_ENV=development. Render sets the equivalent value
      # explicitly in render.yaml; local production smoke can still override
      # the external URLs/secrets without weakening this invariant.
      APP_ENV: production
      APP_HOST: 0.0.0.0
      PORT: ${PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-}
      RUNTIME_DATABASE_URL: ${RUNTIME_DATABASE_URL:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-medical_legal_active}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      PROMPT_REGISTRY_NAME: ${PROMPT_REGISTRY_NAME:-medipay-system}
      PROMPT_REGISTRY_LABEL: ${PROMPT_REGISTRY_LABEL:-production}
      PROMPT_REGISTRY_CACHE_TTL_SECONDS: ${PROMPT_REGISTRY_CACHE_TTL_SECONDS:-300}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-medipay-api}
      OTEL_SAMPLING_RATIO: ${OTEL_SAMPLING_RATIO:-0.1}
      OTEL_MAX_QUEUE_SIZE: ${OTEL_MAX_QUEUE_SIZE:-2048}
      OTEL_MAX_EXPORT_BATCH_SIZE: ${OTEL_MAX_EXPORT_BATCH_SIZE:-256}
      OTEL_SCHEDULE_DELAY_MILLIS: ${OTEL_SCHEDULE_DELAY_MILLIS:-5000}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-5}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-}
      COMMUNITY_INDEX_PATH: ${COMMUNITY_INDEX_PATH:-}
      GLOBAL_MAX_COMMUNITIES: ${GLOBAL_MAX_COMMUNITIES:-3}
      GLOBAL_MAX_ROUNDS: ${GLOBAL_MAX_ROUNDS:-2}
      FEATURE_GLOBAL_SEARCH_ENABLED: ${FEATURE_GLOBAL_SEARCH_ENABLED:-false}
      FEATURE_EXPERIENCE_RETRIEVAL_ENABLED: ${FEATURE_EXPERIENCE_RETRIEVAL_ENABLED:-false}
      FEATURE_TIMELINE_ENABLED: ${FEATURE_TIMELINE_ENABLED:-true}
      FEATURE_ELIGIBILITY_ENABLED: ${FEATURE_ELIGIBILITY_ENABLED:-true}
      EXPERIENCE_INDEX_PATH: ${EXPERIENCE_INDEX_PATH:-}
      RESEARCH_QUEUE_BACKEND: ${RESEARCH_QUEUE_BACKEND:-memory}
      RESEARCH_QUEUE_REDIS_URL: ${RESEARCH_QUEUE_REDIS_URL:-}
      RESEARCH_QUEUE_MAX_PENDING: ${RESEARCH_QUEUE_MAX_PENDING:-32}
      RESEARCH_QUEUE_MAX_WORKERS: ${RESEARCH_QUEUE_MAX_WORKERS:-2}
      RESEARCH_QUEUE_TIMEOUT_SECONDS: ${RESEARCH_QUEUE_TIMEOUT_SECONDS:-90}
      RESEARCH_QUEUE_TTL_SECONDS: ${RESEARCH_QUEUE_TTL_SECONDS:-900}
    ports:
      - "${APP_PORT:-8000}:${PORT:-8000}"

  postgres:
    image: postgres:16.4-alpine
    profiles: [local-full]
    environment:
      POSTGRES_DB: medipay
      POSTGRES_USER: medipay
      POSTGRES_PASSWORD: medipay-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medipay -d medipay"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

  qdrant:
    image: qdrant/qdrant:v1.19.0
    profiles: [local-full]
    environment:
      QDRANT__SERVICE__API_KEY: ${LOCAL_QDRANT_API_KEY:-local-qdrant-only}
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${QDRANT_PORT:-56333}:6333"

  redis:
    image: redis:7.4-alpine
    profiles: [local-full]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    profiles: [local-full]
    environment:
      NEO4J_AUTH: neo4j/${LOCAL_NEO4J_PASSWORD:-local-neo4j-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-57474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-57687}:7687"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    profiles: [local-full]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://medipay:medipay-local-only@postgres:5432/medipay}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  api-local:
    <<: *api-common
    profiles: [local-full]
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: ${LOCAL_CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://medipay:medipay-local-only@postgres:5432/medipay
      RUNTIME_DATABASE_URL: postgresql+asyncpg://medipay:medipay-local-only@postgres:5432/medipay
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${LOCAL_QDRANT_API_KEY:-local-qdrant-only}
      QDRANT_COLLECTION: medical_legal_active
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${LOCAL_NEO4J_PASSWORD:-local-neo4j-only}
      NEO4J_DATABASE: neo4j
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: 1536
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      PROMPT_REGISTRY_NAME: ${PROMPT_REGISTRY_NAME:-medipay-system}
      PROMPT_REGISTRY_LABEL: ${PROMPT_REGISTRY_LABEL:-development}
      PROMPT_REGISTRY_CACHE_TTL_SECONDS: ${PROMPT_REGISTRY_CACHE_TTL_SECONDS:-300}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      COMMUNITY_INDEX_PATH: ${COMMUNITY_INDEX_PATH:-}
      GLOBAL_MAX_COMMUNITIES: ${GLOBAL_MAX_COMMUNITIES:-3}
      GLOBAL_MAX_ROUNDS: ${GLOBAL_MAX_ROUNDS:-2}
      FEATURE_GLOBAL_SEARCH_ENABLED: ${FEATURE_GLOBAL_SEARCH_ENABLED:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

  web-local:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    profiles: [local-full]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3000
    depends_on:
      api-local:
        condition: service_healthy
    networks: [edge, app]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "/usr/bin/node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  corpus-worker:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    profiles: [corpus-worker]
    environment:
      PIPELINE_DATABASE_URL: ${PIPELINE_DATABASE_URL:-}
    networks: [data]

  research-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: [research-worker]
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://medipay:medipay-local-only@postgres:5432/medipay
      RUNTIME_DATABASE_URL: postgresql+asyncpg://medipay:medipay-local-only@postgres:5432/medipay
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${LOCAL_QDRANT_API_KEY:-local-qdrant-only}
      QDRANT_COLLECTION: medical_legal_active
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${LOCAL_NEO4J_PASSWORD:-local-neo4j-only}
      NEO4J_DATABASE: neo4j
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: 1536
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      RESEARCH_QUEUE_BACKEND: redis
      RESEARCH_QUEUE_REDIS_URL: redis://redis:6379/1
      RESEARCH_QUEUE_MAX_PENDING: ${RESEARCH_QUEUE_MAX_PENDING:-32}
      RESEARCH_QUEUE_MAX_WORKERS: ${RESEARCH_QUEUE_MAX_WORKERS:-2}
      RESEARCH_QUEUE_TIMEOUT_SECONDS: ${RESEARCH_QUEUE_TIMEOUT_SECONDS:-90}
      RESEARCH_QUEUE_TTL_SECONDS: ${RESEARCH_QUEUE_TTL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]

  backup:
    image: postgres:16.4-alpine
    profiles: [backup]
    entrypoint: ["sh", "-c"]
    command: ["test -n \"$${BACKUP_DATABASE_URL}\" && pg_dump \"$${BACKUP_DATABASE_URL}\" | gzip > /backups/active.sql.gz"]
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
    volumes:
      - backup_data:/backups
    networks: [data]

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    internal: true
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  backup_data:
