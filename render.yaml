services:
  - type: web
    name: medipay-api
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RUNTIME_DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: medical_legal_active
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "900"
      - key: LLM_REASONING_EFFORT
        value: medium
      - key: LLM_VERBOSITY
        value: low
      - key: LLM_USE_RESPONSES_API
        value: "true"
      - key: QUERY_REWRITE_ENABLED
        value: "true"
      - key: QUERY_REWRITE_TIMEOUT_SECONDS
        value: "10"
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: RETRIEVAL_TIMEOUT_SECONDS
        value: "15"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RATE_LIMIT_REDIS_URL
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: FEATURE_GLOBAL_SEARCH_ENABLED
        value: "false"
      - key: COMMUNITY_INDEX_PATH
        value: ""
      - key: GLOBAL_MAX_COMMUNITIES
        value: "3"
      - key: GLOBAL_MAX_ROUNDS
        value: "2"
