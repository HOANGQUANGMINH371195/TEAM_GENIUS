name: medipay

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to an immutable GHCR digest}
    env_file: .env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      PORT: 8000
      RATE_LIMIT_REDIS_URL: redis://valkey:6379/0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    depends_on:
      valkey:
        condition: service_healthy
    networks: [edge, data]

  migrate:
    image: ${MIGRATION_IMAGE:?Set MIGRATION_IMAGE to an immutable migration digest}
    env_file: .env
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL for the one-shot job}
    profiles: [migration]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    networks: [data]

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable web image digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    networks: [edge]

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      grafana:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/medipay.conf:/etc/nginx/conf.d/medipay.conf:ro
      - ../letsencrypt:/etc/letsencrypt:ro
      - acme_webroot:/var/www/certbot:ro
    networks: [edge]

  prometheus:
    image: prom/prometheus:v3.8.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - ../metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus_data:/prometheus
    networks: [data]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${MEDIPAY_DOMAIN:?Set MEDIPAY_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets: [grafana_admin_password]
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [edge, data]

networks:
  edge:
    driver: bridge
  data:
    # Services are not published on host ports, but API/migrator need outbound
    # access to Supabase, Qdrant Cloud and Neo4j Aura. Docker's `internal`
    # network flag would block that egress and make managed dependencies fail.
    driver: bridge

volumes:
  acme_webroot:
  valkey_data:
  prometheus_data:
  grafana_data:

secrets:
  grafana_admin_password:
    file: ../grafana-admin-password
