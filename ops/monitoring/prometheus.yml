global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: medipay-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api:8000"]

rule_files:
  - /etc/prometheus/prometheus-alerts.yml
